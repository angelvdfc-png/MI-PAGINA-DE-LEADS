<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Leads Rápido</title>
    <!-- Tailwind CSS para un diseño limpio y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Título -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800">Gestor de Leads</h1>
            <p class="text-gray-600 mt-1">Organiza y comparte tus contactos de forma rápida</p>
        </header>

        <!-- Formulario de Nuevo Lead -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Añadir Nuevo Lead</h2>
            <form id="leadForm" class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                    <input type="text" id="nombre" required placeholder="Ej. Juan Pérez" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
                    <input type="tel" id="telefono" required placeholder="Ej. 600123456" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
                    <select id="estado" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="N.C.">N.C. (No Contactado)</option>
                        <option value="O.K">O.K (Éxito / Venta)</option>
                        <option value="K.O">K.O (Descartado)</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200">
                        Añadir Lead
                    </button>
                </div>
            </form>
        </div>

        <!-- Filtros, Listado y Compartir -->
        <div class="bg-white rounded-xl shadow-md p-6">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                <h2 class="text-xl font-semibold text-gray-700">Listado de Contactos</h2>
                
                <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                    <!-- Botón Compartir / Copiar Listado -->
                    <button onclick="copiarListado()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium py-2 px-4 rounded-lg transition duration-200 flex items-center gap-2">
                        📋 Copiar Listado Completo
                    </button>

                    <!-- Filtro por Estado -->
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-medium text-gray-600">Filtrar:</span>
                        <select id="filtroEstado" onchange="renderizarLeads()" class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="TODOS">Todos</option>
                            <option value="N.C.">N.C.</option>
                            <option value="O.K">O.K</option>
                            <option value="K.O">K.O</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Tabla de Leads -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-200 text-gray-600 text-sm">
                            <th class="py-3 px-4">Nombre</th>
                            <th class="py-3 px-4">Teléfono</th>
                            <th class="py-3 px-4">Estado</th>
                            <th class="py-3 px-4 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaLeads" class="divide-y divide-gray-100 text-gray-700">
                        <!-- Los leads se inyectarán aquí mediante JavaScript -->
                    </tbody>
                </table>
                <div id="sinLeads" class="hidden text-center py-8 text-gray-500">
                    No hay leads registrados con este filtro.
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Lógica -->
    <script>
        let leads = JSON.parse(localStorage.getItem('leads')) || [];

        const leadForm = document.getElementById('leadForm');
        const tablaLeads = document.getElementById('tablaLeads');
        const sinLeads = document.getElementById('sinLeads');
        const filtroEstado = document.getElementById('filtroEstado');

        leadForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const nuevoLead = {
                id: Date.now(),
                nombre: document.getElementById('nombre').value.trim(),
                telefono: document.getElementById('telefono').value.trim(),
                estado: document.getElementById('estado').value
            };

            leads.push(nuevoLead);
            guardarYRenderizar();
            leadForm.reset();
        });

        function guardarYRenderizar() {
            localStorage.setItem('leads', JSON.stringify(leads));
            renderizarLeads();
        }

        function cambiarEstado(id, nuevoEstado) {
            const lead = leads.find(l => l.id === id);
            if (lead) {
                lead.estado = nuevoEstado;
                guardarYRenderizar();
            }
        }

        function eliminarLead(id) {
            if (confirm('¿Estás seguro de que deseas eliminar este contacto?')) {
                leads = leads.filter(l => l.id !== id);
                guardarYRenderizar();
            }
        }

        // Función para copiar todo el listado al portapapeles
        function copiarListado() {
            if (leads.length === 0) {
                alert('No hay leads para compartir.');
                return;
            }

            let textoCompartir = "📊 *LISTADO DE LEADS*\n\n";
            leads.forEach((lead, index) => {
                textoCompartir += `${index + 1}. *${lead.nombre}* - Tel: ${lead.telefono} [${lead.estado}]\n`;
            });

            navigator.clipboard.writeText(textoCompartir).then(() => {
                alert('¡Listado copiado al portapapeles! Ya puedes pegarlo en WhatsApp, Telegram o correo.');
            }).catch(err => {
                console.error('Error al copiar: ', err);
                alert('No se pudo copiar el listado.');
            });
        }

        function renderizarLeads() {
            const filtro = filtroEstado.value;
            tablaLeads.innerHTML = '';

            const leadsFiltrados = leads.filter(lead => {
                if (filtro === 'TODOS') return true;
                return lead.estado === filtro;
            });

            if (leadsFiltrados.length === 0) {
                sinLeads.classList.remove('hidden');
                return;
            } else {
                sinLeads.classList.add('hidden');
            }

            leadsFiltrados.forEach(lead => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition duration-150';

                let badgeColor = '';
                if (lead.estado === 'N.C.') badgeColor = 'bg-yellow-100 text-yellow-800';
                if (lead.estado === 'O.K') badgeColor = 'bg-green-100 text-green-800';
                if (lead.estado === 'K.O') badgeColor = 'bg-red-100 text-red-800';

                tr.innerHTML = `
                    <td class="py-3 px-4 font-medium">${lead.nombre}</td>
                    <td class="py-3 px-4">
                        <a href="tel:${lead.telefono}" class="text-blue-600 hover:underline">${lead.telefono}</a>
                    </td>
                    <td class="py-3 px-4">
                        <span class="inline-block px-2.5 py-1 text-xs font-semibold rounded-full ${badgeColor}">
                            ${lead.estado}
                        </span>
                    </td>
                    <td class="py-3 px-4 text-center">
                        <div class="inline-flex items-center gap-2">
                            <select onchange="cambiarEstado(${lead.id}, this.value)" class="text-xs border border-gray-300 rounded px-2 py-1 bg-white focus:outline-none">
                                <option value="N.C." ${lead.estado === 'N.C.' ? 'selected' : ''}>N.C.</option>
                                <option value="O.K" ${lead.estado === 'O.K' ? 'selected' : ''}>O.K</option>
                                <option value="K.O" ${lead.estado === 'K.O' ? 'selected' : ''}>K.O</option>
                            </select>
                            <button onclick="eliminarLead(${lead.id})" class="text-red-500 hover:text-red-700 text-sm p-1" title="Eliminar">
                                🗑️
                            </button>
                        </div>
                    </td>
                `;
                tablaLeads.appendChild(tr);
            });
        }

        renderizarLeads();
    </script>
</body>
</html>
